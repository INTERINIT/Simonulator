plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'org.interinit.simonulator'
    compileSdk 35
    ndkVersion '27.2.12479018'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'org.interinit.simonulator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.jniLibs.srcDirs = ['../mame/android-project/app/src/main/libs']
    packaging.jniLibs.useLegacyPackaging = true
}

dependencies {
    implementation files('build/sdl/SDL3.aar')
}

tasks.register('checkSimonCore') {
    doLast {
        ['libmain.so', 'libSDL3.so', 'libc++_shared.so'].each { library ->
            if (!file("../mame/android-project/app/src/main/libs/arm64-v8a/${library}").isFile())
                throw new GradleException("Build the arm64 Simon core first: missing ${library}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkSimonCore' }
